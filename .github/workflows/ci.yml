name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Mirrors the local gate (.githooks/pre-commit and `make bump`):
      # default features (postgres + sqlite + deploy), no live database needed.
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  embedded-tests:
    name: embedded postgres integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `postgresql_embedded` downloads and runs its own PostgreSQL, so no
      # service container or DATABASE_URL is required.
      - name: cargo test (embedded-tests)
        run: cargo test -p dbd-core --features embedded-tests --test embedded_test
