name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Least privilege: the job only checks out, builds/tests, and uploads coverage
# via its own token (QLTY_COVERAGE_TOKEN) — it needs no write access to the repo.
permissions:
  contents: read

jobs:
  test:
    name: test + clippy + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Don't persist the GITHUB_TOKEN in .git/config — nothing here pushes
          # or needs git auth after checkout (coverage uploads via its own token),
          # so persisting it only risks leaking it into artifacts (zizmor artipacked).
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-llvm-cov
      # Mirrors the local gate (.githooks/pre-commit and `make bump`):
      # default features (postgres + sqlite + deploy). Doctests run separately
      # (llvm-cov skips them on stable), keeping the gate equal to
      # `cargo test --workspace`.
      # main.rs is excluded: it's the binary entry point (clap wiring + error
      # print) that the test harness never executes, so it can only ever report
      # 0% and would drag the metric down as unreachable noise.
      #
      # Coverage is collected across two instrumented runs and merged so the
      # PostgreSQL adapter's real coverage is reflected: the default workspace
      # suite, then the embedded-PostgreSQL integration suite (feature-gated and
      # serial — each test boots its own in-process postgres). `--no-report`
      # accumulates raw profiles; the final `report` merges them into one lcov.
      - name: cargo test + coverage (workspace + embedded, merged)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --workspace
          cargo llvm-cov --no-report -p dbd-core --features embedded-tests --test embedded_test -- --test-threads=1
          # llvm-cov records absolute paths, so this is anchored at the end
          # only — a leading ^ would never match, silently letting main.rs
          # back into the metric with CI still green.
          cargo llvm-cov report --lcov --output-path target/lcov.info --ignore-filename-regex 'src/main\.rs$'
      - name: cargo test (doctests)
        run: cargo test --workspace --doc
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Formatting is enforced from v0.12.0. The tree was hand-formatted and had
      # never been rustfmt-clean; rustfmt.toml pins max_width = 120 to match the
      # house style, and the whole tree was normalised in one commit.
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: upload coverage to qlty
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: target/lcov.info
