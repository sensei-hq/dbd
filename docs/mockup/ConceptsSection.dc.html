<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="dbd/fonts.css">
<script src="dbd/uno.config.js"></script>
<script src="dbd/content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime@0.61.9/uno.global.js"></script>
</helmet>
<section id="concepts" class="section-plain">
  <div class="shell relative z-1 py-section">
    <dc-import name="SectionHead" eyebrow="{{ eyebrow }}" title="{{ title }}" align="center" hint-size="100%,140px"></dc-import>
    <div class="mt-14 flex flex-col gap-16">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="5">
        <div class="grid items-center gap-14 grid-cols-2 lt-md:grid-cols-1 lt-md:gap-7">
          <div class="flex flex-col gap-4 {{ item.textOrder }}">
            <div class="flex items-center gap-3">
              <span class="badge text-caption border border-accent-line">{{ item.num }}</span>
              <span class="kicker">{{ item.kicker }}</span>
            </div>
            <h3 class="font-display font-semibold text-title-lg tracking-title text-fg text-balance m-0">{{ item.title }}</h3>
            <p class="text-base text-muted text-pretty m-0">{{ item.body }}</p>
          </div>
          <div class="min-w-0 {{ item.codeOrder }}">
            <dc-import name="CodeFrame" label="{{ item.codeLabel }}" lang="{{ item.codeLang }}" source="{{ item.codeSource }}" hint-size="100%,200px"></dc-import>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const C = (typeof window !== "undefined" && window.DBD_CONTENT) || { concepts: { items: [] } };
    const c = C.concepts;
    return {
      eyebrow: c.eyebrow,
      title: c.title,
      items: (c.items || []).map((it, i) => {
        const flip = i % 2 === 1;
        return {
          num: String(i + 1).padStart(2, "0"),
          kicker: it.kicker,
          title: it.title,
          body: it.body,
          codeLabel: it.code.label,
          codeLang: it.code.lang,
          codeSource: it.code.source,
          textOrder: flip ? "order-2 lt-md:order-1" : "order-1",
          codeOrder: flip ? "order-1 lt-md:order-2" : "order-2",
        };
      }),
    };
  }
}

</script>
</body>
</html>
