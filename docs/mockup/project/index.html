<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="sky" data-density="comfortable">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dbd — Database schemas as code</title>
  <link rel="icon" type="image/svg+xml" href="dbd-icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- ============================================================
       SEMANTIC COLOR SYSTEM
       Tokens are CSS variables, themed by [data-theme] + [data-accent].
       Components NEVER hardcode color — they use Tailwind utilities
       (bg-surface, text-muted, border-line, etc.) that map to these.
       ============================================================ -->
  <style>
    :root {
      /* accent hue is overridable via [data-accent]; default = rust */
      --accent-h: 52;
      --accent-c: 0.135;
    }

    /* ---- DARK THEME (default) ---- */
    [data-theme="dark"] {
      --bg:        oklch(0.185 0.035 245);
      --bg-deep:   oklch(0.15 0.035 245);
      --surface:   oklch(0.225 0.037 245);
      --surface-2: oklch(0.27 0.038 245);
      --line:      oklch(0.325 0.04 245);
      --line-soft: oklch(0.27 0.035 245);

      --fg:        oklch(0.965 0.006 240);
      --muted:     oklch(0.74 0.014 245);
      --faint:     oklch(0.58 0.016 245);

      --accent:      oklch(0.78 var(--accent-c) var(--accent-h));
      --accent-2:    oklch(0.70 var(--accent-c) var(--accent-h));
      --on-accent:   oklch(0.17 0.02 var(--accent-h));
      --accent-soft: oklch(0.30 0.05 var(--accent-h));
      --accent-line: oklch(0.42 0.07 var(--accent-h));

      /* syntax tokens */
      --code-bg:    oklch(0.16 0.035 245);
      --tok-comment: oklch(0.56 0.016 245);
      --tok-key:     oklch(0.78 var(--accent-c) var(--accent-h));
      --tok-str:     oklch(0.80 0.09 155);
      --tok-num:     oklch(0.80 0.09 220);
      --tok-punct:   oklch(0.62 0.014 245);
      --tok-arrow:   oklch(0.70 var(--accent-c) var(--accent-h));
    }

    /* ---- LIGHT THEME ---- */
    /* Warm paper white: a faint amber tinge (hue ~85) reads as clean
       off-white paper and sits complementary to the sky-blue accent. */
    [data-theme="light"] {
      --bg:        oklch(0.987 0.006 85);
      --bg-deep:   oklch(0.967 0.008 85);
      --surface:   oklch(0.996 0.004 85);
      --surface-2: oklch(0.978 0.006 85);
      --line:      oklch(0.905 0.009 85);
      --line-soft: oklch(0.942 0.007 85);

      --fg:        oklch(0.25 0.012 80);
      --muted:     oklch(0.48 0.014 80);
      --faint:     oklch(0.62 0.014 80);

      --accent:      oklch(0.55 0.13 var(--accent-h));
      --accent-2:    oklch(0.49 0.135 var(--accent-h));
      --on-accent:   oklch(0.99 0.012 var(--accent-h));
      --accent-soft: oklch(0.93 0.035 var(--accent-h));
      --accent-line: oklch(0.83 0.06 var(--accent-h));

      --code-bg:    oklch(0.97 0.008 85);
      --tok-comment: oklch(0.6 0.012 80);
      --tok-key:     oklch(0.5 0.13 var(--accent-h));
      --tok-str:     oklch(0.50 0.11 155);
      --tok-num:     oklch(0.50 0.12 250);
      --tok-punct:   oklch(0.5 0.012 80);
      --tok-arrow:   oklch(0.5 0.13 var(--accent-h));
    }

    /* accent presets */
    [data-accent="sky"]   { --accent-h: 245; --accent-c: 0.12; }
    [data-accent="rust"]  { --accent-h: 52;  --accent-c: 0.135; }
    [data-accent="blue"]  { --accent-h: 250; --accent-c: 0.115; }
    [data-accent="green"] { --accent-h: 155; --accent-c: 0.115; }
    [data-accent="violet"]{ --accent-h: 300; --accent-c: 0.115; }

    html { scroll-behavior: smooth; }
    section[id], [id="top"] { scroll-margin-top: 84px; }
    body { background: var(--bg); color: var(--fg); }
    ::selection { background: var(--accent-soft); color: var(--fg); }

    /* grid backdrop helper */
    .bg-grid {
      background-image:
        linear-gradient(to right, var(--line-soft) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    /* section-level grid backdrop: paints the grid behind a section's
       content over whatever background tint the section carries. */
    .grid-section { position: relative; isolation: isolate; }
    .grid-section::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--line-soft) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: 0.55;
    }
    .grid-section > * { position: relative; z-index: 1; }
    .mask-fade-b { -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 100%); }

    /* density */
    [data-density="compact"]    { --section-y: 4.5rem; }
    [data-density="comfortable"]{ --section-y: 7rem; }
    [data-density="spacious"]   { --section-y: 9.5rem; }

    pre { font-variant-ligatures: none; }
    .anim-rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .anim-rise { animation: none; } }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "var(--bg)",
            "bg-deep": "var(--bg-deep)",
            surface: "var(--surface)",
            "surface-2": "var(--surface-2)",
            line: "var(--line)",
            "line-soft": "var(--line-soft)",
            fg: "var(--fg)",
            muted: "var(--muted)",
            faint: "var(--faint)",
            accent: "var(--accent)",
            "accent-2": "var(--accent-2)",
            "on-accent": "var(--on-accent)",
            "accent-soft": "var(--accent-soft)",
            "accent-line": "var(--accent-line)",
            "code-bg": "var(--code-bg)",
            "tok-comment": "var(--tok-comment)",
            "tok-key": "var(--tok-key)",
            "tok-str": "var(--tok-str)",
            "tok-num": "var(--tok-num)",
            "tok-punct": "var(--tok-punct)",
            "tok-arrow": "var(--tok-arrow)",
          },
          fontFamily: {
            display: ['"Space Grotesk"', "system-ui", "sans-serif"],
            sans: ['"IBM Plex Sans"', "system-ui", "sans-serif"],
            mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
          },
          /* MODULAR TYPE SCALE (~1.25 minor third, fluid where it matters) */
          fontSize: {
            "label": ["0.72rem", { lineHeight: "1.1", letterSpacing: "0.14em" }],
            "xs":  ["0.8rem",  { lineHeight: "1.5" }],
            "sm":  ["0.9rem",  { lineHeight: "1.6" }],
            "base":["1rem",    { lineHeight: "1.65" }],
            "lg":  ["1.15rem", { lineHeight: "1.6" }],
            "xl":  ["1.4rem",  { lineHeight: "1.4", letterSpacing: "-0.01em" }],
            "h3":  ["1.55rem", { lineHeight: "1.25", letterSpacing: "-0.015em" }],
            "h2":  ["clamp(1.9rem, 3.2vw, 2.7rem)", { lineHeight: "1.08", letterSpacing: "-0.022em" }],
            "display": ["clamp(2.6rem, 6vw, 4.6rem)", { lineHeight: "0.98", letterSpacing: "-0.035em" }],
          },
          maxWidth: { content: "76rem" },
          spacing: { section: "var(--section-y)" },
          borderRadius: { xl2: "1.1rem" },
        },
      },
    };
  </script>
</head>
<body class="font-sans antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="highlight.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="main.jsx"></script>
</body>
</html>
