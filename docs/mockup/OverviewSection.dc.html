<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="dbd/fonts.css">
<script src="dbd/uno.config.js"></script>
<script src="dbd/content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime@0.61.9/uno.global.js"></script>
</helmet>
<section id="overview" class="section-band">
  <div class="shell relative z-1 py-section">
    <dc-import name="SectionHead" eyebrow="{{ eyebrow }}" title="{{ title }}" lede="{{ lede }}" hint-size="100%,200px"></dc-import>
    <div class="mt-12 grid-3">
      <sc-for list="{{ features }}" as="f" hint-placeholder-count="6">
        <dc-import name="InfoCard" title="{{ f.title }}" body="{{ f.body }}" hint-size="100%,160px"></dc-import>
      </sc-for>
    </div>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const C = (typeof window !== "undefined" && window.DBD_CONTENT) || { overview: { features: [] } };
    const o = C.overview;
    return { eyebrow: o.eyebrow, title: o.title, lede: o.lede, features: o.features };
  }
}

</script>
</body>
</html>
