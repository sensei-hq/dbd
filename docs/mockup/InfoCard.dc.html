<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="dbd/fonts.css">
<script src="dbd/uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime@0.61.9/uno.global.js"></script>
</helmet>
<div class="{{ wrapCls }}">
  <h3 class="{{ titleCls }}">{{ title }}</h3>
  <p class="copy">{{ body }}</p>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:180},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dependency ordering&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tables with foreign keys are applied after the tables they reference.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;feature&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;feature&quot;,&quot;tsType&quot;:&quot;'feature' | 'compact'&quot;}}">
// Title + body card. `feature` = larger heading (overview grid);
// `compact` = smaller heading, tighter gap (audience grid).
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const compact = p.variant === "compact";
    return {
      wrapCls: compact ? "card gap-2" : "card gap-3",
      titleCls: compact ? "h4" : "h3",
      title: p.title ?? "Card title",
      body: p.body ?? "",
    };
  }
}

</script>
</body>
</html>
