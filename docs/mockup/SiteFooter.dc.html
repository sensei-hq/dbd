<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="dbd/fonts.css">
<script src="dbd/uno.config.js"></script>
<script src="dbd/content.js"></script>
<script src="dbd/dbd-logo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime@0.61.9/uno.global.js"></script>
</helmet>
<footer class="bg-bg">
  <div class="shell grid gap-10 py-14 grid-cols-[1.4fr_1fr_1fr] lt-sm:grid-cols-1 lt-sm:gap-8">
    <div class="flex flex-col gap-3">
      <a href="#top" class="inline-flex items-center gap-2.5">
        <span class="inline-flex flex-none size-16 text-accent">{{ brandMark }}</span>
        <span class="font-display font-semibold text-title-sm tracking-brand text-fg">{{ brandName }}</span>
      </a>
      <p class="max-w-note text-body text-muted m-0">{{ tagline }}</p>
    </div>
    <sc-for list="{{ columns }}" as="col" hint-placeholder-count="2">
      <div class="flex flex-col gap-3">
        <span class="kicker">{{ col.title }}</span>
        <ul class="flex flex-col gap-2 list-none m-0 p-0">
          <sc-for list="{{ col.links }}" as="l" hint-placeholder-count="3">
            <li><a href="{{ l.href }}" class="text-body text-muted">{{ l.label }}</a></li>
          </sc-for>
        </ul>
      </div>
    </sc-for>
  </div>
  <div class="border-t border-line">
    <div class="shell flex flex-wrap items-center justify-between gap-2 py-5">
      <span class="font-mono text-caption text-faint">{{ brandName }} — {{ brandFull }}</span>
      <span class="text-caption text-faint">{{ legal }}</span>
    </div>
  </div>
</footer>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const C = (typeof window !== "undefined" && window.DBD_CONTENT) || { brand: {}, footer: { columns: [] } };
    const svg = (typeof window !== "undefined" && window.DBD_LOGO_SVG) || "";
    return {
      brandName: C.brand.name,
      brandFull: C.brand.full,
      tagline: C.footer.tagline,
      columns: C.footer.columns,
      legal: C.footer.legal,
      brandMark: React.createElement("span", { className: "inline-flex w-full h-full", dangerouslySetInnerHTML: { __html: svg } }),
    };
  }
}

</script>
</body>
</html>
