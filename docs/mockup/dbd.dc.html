<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="dbd/fonts.css">
<script src="dbd/uno.config.js"></script>
<script src="dbd/content.js"></script>
<script src="dbd/highlight.js"></script>
<script src="dbd/dbd-logo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime@0.61.9/uno.global.js"></script>
</helmet>
<div class="dbd-root min-h-screen bg-bg text-fg font-sans antialiased" data-theme="light" data-accent="sky" data-density="comfortable" ref="{{ setRoot }}">
  <dc-import name="SiteHeader" theme="{{ theme }}" onToggle="{{ toggleTheme }}" hint-size="100%,72px"></dc-import>
  <main class="relative">
    <div class="absolute inset-0 z-0 pointer-events-none opacity-55 bg-grid"></div>
    <dc-import name="HeroSection" titleA="{{ heroTitleA }}" titleB="{{ heroTitleB }}" hint-size="100%,560px"></dc-import>
    <dc-import name="OverviewSection" hint-size="100%,760px"></dc-import>
    <dc-import name="ConceptsSection" hint-size="100%,1400px"></dc-import>
    <dc-import name="TargetsSection" hint-size="100%,620px"></dc-import>
    <dc-import name="CommandsSection" hint-size="100%,560px"></dc-import>
    <dc-import name="AudienceSection" hint-size="100%,480px"></dc-import>
    <dc-import name="StartSection" hint-size="100%,520px"></dc-import>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sky&quot;,&quot;rust&quot;,&quot;green&quot;,&quot;violet&quot;],&quot;default&quot;:&quot;sky&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;compact&quot;,&quot;comfortable&quot;,&quot;spacious&quot;],&quot;default&quot;:&quot;comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;heroTitleA&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Your database schema,&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero copy&quot;},&quot;heroTitleB&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;managed like source code.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero copy&quot;}}">
/**
 * dbd landing page — composition root.
 *
 * Owns only the theme shell: it writes data-theme / data-accent / data-density
 * onto .dbd-root, where dbd/uno.config.js's preflight turns them into tokens.
 * Every section is its own component and reads its own slice of
 * dbd/content.js, so nothing is threaded through here.
 */
class Component extends DCLogic {
  state = {};

  eff(key, fallback) {
    if (this.state[key] != null) return this.state[key];
    if (this.props[key] != null) return this.props[key];
    return fallback;
  }

  applyTheme() {
    if (!this.rootEl) return;
    this.rootEl.setAttribute("data-theme", this.eff("theme", "light"));
    this.rootEl.setAttribute("data-accent", this.eff("accent", "sky"));
    this.rootEl.setAttribute("data-density", this.eff("density", "comfortable"));
  }
  componentDidMount() { this.applyTheme(); }
  componentDidUpdate() { this.applyTheme(); }

  renderVals() {
    const theme = this.eff("theme", "light");
    const C = (typeof window !== "undefined" && window.DBD_CONTENT) || { hero: {} };
    return {
      theme,
      heroTitleA: this.eff("heroTitleA", C.hero.titleA),
      heroTitleB: this.eff("heroTitleB", C.hero.titleB),
      setRoot: (el) => { this.rootEl = el; this.applyTheme(); },
      toggleTheme: () => this.setState({ theme: theme === "dark" ? "light" : "dark" }),
    };
  }
}

</script>
</body>
</html>
