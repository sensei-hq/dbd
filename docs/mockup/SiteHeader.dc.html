<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="dbd/fonts.css">
<script src="dbd/uno.config.js"></script>
<script src="dbd/content.js"></script>
<script src="dbd/dbd-logo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime@0.61.9/uno.global.js"></script>
</helmet>
<header class="sticky top-0 z-40 bg-header backdrop-blur-md">
  <div class="shell flex items-center justify-between gap-6 py-3.5">
    <a href="#top" class="inline-flex items-center gap-2.5">
      <span class="inline-flex flex-none size-8 text-accent">{{ brandMark }}</span>
      <span class="font-display font-semibold text-title-sm tracking-brand text-fg">{{ brandName }}</span>
    </a>
    <nav class="flex items-center gap-7 lt-md:hidden">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" class="whitespace-nowrap text-body text-muted">{{ l.label }}</a>
      </sc-for>
    </nav>
    <div class="flex items-center gap-3">
      <button onClick="{{ onToggle }}" aria-label="Toggle color theme" class="grid size-9 place-items-center rounded-lg border border-line bg-transparent text-muted cursor-pointer">{{ themeIcon }}</button>
      <a href="#top" class="whitespace-nowrap text-body text-muted lt-sm:hidden">Sign in</a>
      <dc-import name="Button" label="{{ ctaLabel }}" href="{{ ctaHref }}" size="sm" hint-size="136px,40px"></dc-import>
    </div>
  </div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:72},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  icon(theme) {
    const h = React.createElement;
    if (theme === "dark") {
      return h("svg", { viewBox: "0 0 20 20", className: "size-4", fill: "none", stroke: "currentColor", strokeWidth: "1.5" },
        h("circle", { cx: "10", cy: "10", r: "4" }),
        h("path", { d: "M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4", strokeLinecap: "round" })
      );
    }
    return h("svg", { viewBox: "0 0 20 20", className: "size-4", fill: "none", stroke: "currentColor", strokeWidth: "1.5" },
      h("path", { d: "M16 11.5A6.5 6.5 0 0 1 8.5 4a6.5 6.5 0 1 0 7.5 7.5z", strokeLinejoin: "round" })
    );
  }

  renderVals() {
    const C = (typeof window !== "undefined" && window.DBD_CONTENT) || { brand: {}, nav: { links: [], cta: {} } };
    const svg = (typeof window !== "undefined" && window.DBD_LOGO_SVG) || "";
    return {
      brandName: C.brand.name,
      links: C.nav.links,
      ctaLabel: C.nav.cta.label,
      ctaHref: C.nav.cta.href,
      brandMark: React.createElement("span", { className: "inline-flex w-full h-full", dangerouslySetInnerHTML: { __html: svg } }),
      themeIcon: this.icon(this.props.theme || "light"),
      onToggle: this.props.onToggle || (() => {}),
    };
  }
}

</script>
</body>
</html>
