<!DOCTYPE html>
<html lang="en" data-theme="light" data-look="paper" data-accent="sky">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — dbd designs</title>
  <link rel="icon" type="image/svg+xml" href="../dbd-icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app-styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tw-config.js"></script>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="app-data.js"></script>
  <script src="../dbd-logo.js"></script>
  <script type="text/babel" src="app-shell.jsx"></script>

  <script type="text/babel">
    function SignInPage() {
      const [prefs, setPref] = useAppPrefs();
      const [email, setEmail] = React.useState("");
      const [sent, setSent] = React.useState(false);
      const valid = /.+@.+\..+/.test(email);

      const submit = (e) => {
        e.preventDefault();
        if (valid) setSent(true);
      };

      return (
        <div className="bg-grid64 relative flex min-h-screen flex-col" data-screen-label="Sign in">
          {/* top-left: back to site; top-right: theme */}
          <div className="flex items-center justify-between p-5">
            <a href="../index.html" className="flex items-center gap-2 text-sm text-muted hover:text-fg">
              <Ic name="arrowL" size={15}></Ic> dbd.dev
            </a>
            <button className="ds-iconbtn" onClick={() => setPref("theme", prefs.theme === "light" ? "dark" : "light")}
              title="Toggle theme">
              <Ic name={prefs.theme === "light" ? "moon" : "sun"} size={17}></Ic>
            </button>
          </div>

          <div className="flex flex-1 items-center justify-center px-5 pb-24">
            <div className="ds-card w-full max-w-md p-8 sm:p-10">
              <div className="flex items-center gap-3">
                <BrandMark size={34}></BrandMark>
                <div>
                  <div className="font-display text-lg font-semibold leading-tight">dbd designs</div>
                  <div className="text-xs text-faint">Publish schemas. Browse them visually.</div>
                </div>
              </div>

              {!sent ? (
                <form onSubmit={submit} className="mt-8 flex flex-col gap-4">
                  <h1 className="font-display text-xl font-semibold tracking-tight">Sign in</h1>
                  <label className="flex flex-col gap-1.5">
                    <span className="text-label font-mono uppercase text-faint">Email</span>
                    <input
                      className="ds-input" type="email" autoFocus
                      placeholder="you@company.com" value={email}
                      onChange={(e) => setEmail(e.target.value)}
                    />
                  </label>
                  <button type="submit" className="ds-btn ds-btn-primary justify-center py-3" disabled={!valid}
                    style={{ opacity: valid ? 1 : 0.55 }}>
                    <Ic name="mail" size={15}></Ic> Email me a magic link
                  </button>
                  <p className="text-center text-xs text-faint">
                    No password. We send a one-time sign-in link to your inbox.
                  </p>
                </form>
              ) : (
                <div className="mt-8 flex flex-col gap-4">
                  <div className="flex items-center gap-2.5 rounded-app border border-accent-line bg-accent-soft px-4 py-3 text-sm" style={{ color: "var(--accent-2)" }}>
                    <Ic name="check" size={16}></Ic>
                    <span>Magic link sent to <strong className="font-mono text-xs">{email}</strong></span>
                  </div>
                  <p className="text-sm text-muted">
                    Open the link on this device to finish signing in. The link expires in 15 minutes.
                  </p>
                  <a href="Projects.html" className="ds-btn justify-center py-3">
                    Open the magic link <Ic name="arrowR" size={15}></Ic>
                    <span className="ds-badge">prototype</span>
                  </a>
                  <button className="text-center text-xs text-faint hover:text-muted" onClick={() => setSent(false)}>
                    Use a different email
                  </button>
                </div>
              )}
            </div>
          </div>

          <div className="pb-6 text-center font-mono text-xs text-faint">
            $ dbd push&nbsp;&nbsp;·&nbsp;&nbsp;publishes straight from your terminal once you're signed in
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SignInPage></SignInPage>);
  </script>
</body>
</html>
