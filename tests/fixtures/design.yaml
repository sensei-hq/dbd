project:
  name: example
  note: Example project for testing

source:
  dialect: postgresql

target:
  postgres:
    url: $DATABASE_URL
    extensions:
      - uuid-ossp
      - name: postgis
        schema: extensions
      - pg_cron
    roles:
      - name: advanced
        refers:
          - basic
      - name: basic

schemas:
  - config
  - staging
  - extensions

external:
  - name: auth.users
    note: Managed authentication table
    columns:
      - id: uuid

import:
  staging:
    - staging
  options:
    truncate: true
    null_value: ''
    format: csv
  tables:
    - staging.lookups
    - staging.lookup_values:
        truncate: false
        format: tsv
  after:
    - import/loader.sql

export:
  - config.lookups
  - config.lookup_values:
      format: jsonl

materialized_views:
  options:
    refresh: "0 3 * * *"
    concurrently: true
  overrides:
    config.genders_mv:
      refresh: "*/15 * * * *"

dbml:
  base:
    exclude:
      schemas:
        - staging
        - extensions

ignore:
  - bfs
  - my_company.*

scopes:
  config_only:
    includes:
      - config
  incomplete:
    includes:
      - config.lookup_values   # needs config.lookups → dependency gap
  incomplete_auto:
    includes:
      - config.lookup_values
    deps: include
  config_wild:
    includes:
      - config.*          # wildcard: every entity under the config schema
  drop_staging:
    excludes:
      - staging.*         # wildcard: drop staging's entities, keep the schema
  conflicting:
    includes:
      - config.lookup_values
    excludes:
      - config.lookups    # lookup_values requires it -> closure conflict
    deps: include
