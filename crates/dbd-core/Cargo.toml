[package]
name = "dbd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Database schema management library — parse, validate, apply, migrate"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true

# SQL Parsing
sqlparser = { version = "0.61", features = ["visitor"] }

# File system & parallelism
walkdir = "2"
rayon = "1"
regex = "1"

# Async
tokio.workspace = true
async-trait = "0.1"

# PostgreSQL
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"], optional = true }
futures-lite = "2"

# Utilities
sha2 = "0.10"
chrono = "0.4"
dirs = "6"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
insta = "1"
tempfile = "3"
pretty_assertions = "1"
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]
