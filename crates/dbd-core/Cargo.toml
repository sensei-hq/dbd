[package]
name = "dbd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Database schema management library — parse, validate, apply, migrate"
readme = "../../README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true

# SQL Parsing
sqlparser = { version = "0.61", features = ["visitor"] }

# File system & parallelism
walkdir = "2"
rayon = "1"
regex = "1"

# Async
tokio.workspace = true
async-trait = "0.1"

# PostgreSQL
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"], optional = true }
futures-lite = "2"

# HTTP & archive (for deploy --source github)
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false, optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

# Utilities
sha2 = "0.10"
chrono = "0.4"
dirs = "6"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
insta = "1"
tempfile = "3"
pretty_assertions = "1"
tokio = { version = "1", features = ["full", "test-util"] }
postgresql_embedded = "0.20"

[features]
default = ["postgres", "deploy"]
postgres = ["dep:sqlx"]
deploy = ["dep:reqwest", "dep:flate2", "dep:tar"]
# Enable embedded PostgreSQL integration tests.
# cargo test --features embedded-tests --test embedded_test
embedded-tests = []
